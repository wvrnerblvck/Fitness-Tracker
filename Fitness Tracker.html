<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tracker — Warren</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{--paper:#EAE8E0;--card:#F4F2EC;--ink:#17160F;--muted:#6E6D63;--line:#D3D0C5;--steel:#2C3A44;--ember:#B23D0B;--good:#2F7D4F;--font:'Archivo',system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace;}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--paper);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased}
  body{padding-bottom:120px;line-height:1.4}
  .wrap{max-width:640px;margin:0 auto;padding:0 16px}
  header{padding:22px 16px 14px;max-width:640px;margin:0 auto}
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--ember);font-weight:500}
  h1{font-size:30px;font-weight:700;letter-spacing:-.02em;margin:4px 0 2px}
  .meta{font-family:var(--mono);font-size:12px;color:var(--muted)}
  .tabs{display:flex;gap:6px;overflow-x:auto;padding:6px 16px 12px;max-width:640px;margin:0 auto;-webkit-overflow-scrolling:touch}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:0 0 auto;position:relative;font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;font-weight:500;color:var(--muted);background:var(--card);border:1.5px solid var(--line);border-radius:8px;padding:9px 13px;cursor:pointer;white-space:nowrap}
  .tab.on{color:#fff;background:var(--steel);border-color:var(--steel)}
  .tab .dot{position:absolute;top:-4px;right:-4px;width:8px;height:8px;border-radius:50%;background:var(--ember)}
  .sticky{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1.5px solid var(--line)}
  .card{background:var(--card);border:1.5px solid var(--line);border-radius:12px;margin-bottom:12px;overflow:hidden}
  .card.pri{border-color:var(--ember)}
  .ehead{padding:13px 15px 11px;border-bottom:1px solid var(--line)}
  .ename{font-size:17px;font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .flag{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:#fff;background:var(--ember);border-radius:4px;padding:2px 6px}
  .enote{font-size:12.5px;color:var(--muted);margin-top:3px}
  .elast{font-family:var(--mono);font-size:11px;color:var(--steel);margin-top:6px}
  .elast .none{color:var(--muted)}
  .rec{margin-top:9px;background:var(--paper);border:1.5px solid var(--line);border-radius:9px;padding:9px 11px}
  .rec.hot{border-color:var(--ember)}
  .recline{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .rectag{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;background:var(--steel);color:#fff;border-radius:4px;padding:3px 7px}
  .rec.hot .rectag{background:var(--ember)}
  .recmain{font-family:var(--mono);font-weight:700;font-size:15px}
  .recwhy{font-size:12.5px;color:var(--muted);margin-top:5px;line-height:1.45}
  .setrow{display:flex;align-items:center;gap:8px;padding:9px 15px;border-bottom:1px solid var(--line)}
  .setrow:last-child{border-bottom:0}
  .snum{font-family:var(--mono);font-size:12px;color:var(--muted);width:40px;flex:0 0 40px}
  .fld{flex:1;display:flex;flex-direction:column;gap:2px}
  .fld label{font-family:var(--mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .fld input{font-family:var(--mono);font-size:15px;font-weight:500;color:var(--ink);background:var(--paper);border:1.5px solid var(--line);border-radius:7px;padding:7px 9px;width:100%;text-align:center}
  .fld input:focus{outline:none;border-color:var(--steel)}
  .done{flex:0 0 44px;width:44px;height:44px;border-radius:9px;border:1.5px solid var(--line);background:var(--paper);cursor:pointer;font-size:20px;color:var(--muted);display:flex;align-items:center;justify-content:center;align-self:flex-end}
  .setrow.ok .done{background:var(--good);border-color:var(--good);color:#fff}
  .setrow.ok input{border-color:var(--good)}
  .finishbar{padding:6px 0 2px}
  .btn{width:100%;font-family:var(--font);font-size:15px;font-weight:600;border-radius:10px;padding:14px;cursor:pointer;border:1.5px solid}
  .btn-primary{background:var(--ember);color:#fff;border-color:var(--ember)}
  .btn-ghost{background:var(--card);color:var(--ink);border-color:var(--line)}
  .btn-row{display:flex;gap:8px;margin-top:8px}
  .btn-row .btn{font-size:13px;padding:11px}
  details{background:var(--card);border:1.5px solid var(--line);border-radius:12px;margin-bottom:12px;padding:0 15px}
  summary{list-style:none;cursor:pointer;padding:13px 0;font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--steel);display:flex;justify-content:space-between;align-items:center}
  summary::-webkit-details-marker{display:none}
  summary::after{content:'+';font-size:18px;color:var(--ember)}
  details[open] summary::after{content:'–'}
  .note{padding:11px 0;border-top:1px solid var(--line);display:flex;gap:12px;font-size:13.5px}
  .note .k{font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--ember);font-weight:700;min-width:82px;flex:0 0 82px;padding-top:2px}
  .note b{font-weight:600}
  #rest{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--steel);color:#fff;transform:translateY(110%);transition:transform .25s ease;padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
  #rest.up{transform:translateY(0)}
  .restwrap{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:12px}
  #restTime{font-family:var(--mono);font-size:30px;font-weight:700;min-width:96px}
  .restlbl{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;opacity:.7;flex:1}
  .rbtn{font-family:var(--mono);font-size:13px;font-weight:500;background:rgba(255,255,255,.14);color:#fff;border:none;border-radius:8px;padding:9px 11px;cursor:pointer}
  .phasepick{display:flex;gap:6px;margin-bottom:14px}
  .ph{flex:1;font-family:var(--mono);font-size:11px;font-weight:500;text-align:center;background:var(--card);border:1.5px solid var(--line);border-radius:8px;padding:10px 4px;cursor:pointer;color:var(--muted)}
  .ph.on{border-color:var(--ember);color:var(--ember);background:#F7EEE7}
  .sprintbox{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:20px 16px;text-align:center;margin-bottom:12px}
  #sprintState{font-family:var(--mono);font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
  #sprintState.work{color:var(--ember)} #sprintState.rest{color:var(--steel)}
  #sprintTime{font-family:var(--mono);font-size:64px;font-weight:700;line-height:1;margin:8px 0}
  #sprintRound{font-family:var(--mono);font-size:14px;color:var(--muted)}
  .sprintbtns{display:flex;gap:8px;margin-top:16px}
  .phasemeta{font-size:13px;color:var(--muted);margin-bottom:14px;line-height:1.5}
  .hitem{background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px}
  .hhead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
  .hday{font-size:16px;font-weight:700}
  .hdate{font-family:var(--mono);font-size:11px;color:var(--muted)}
  .hline{font-family:var(--mono);font-size:12px;color:var(--ink);padding:2px 0;display:flex;justify-content:space-between;gap:10px}
  .hline .hn{color:var(--muted)}
  .empty{text-align:center;color:var(--muted);font-size:14px;padding:30px 10px}
  /* profile */
  .ptoggle{display:flex;gap:6px;margin-bottom:12px}
  .tg{flex:1;font-family:var(--mono);font-size:12px;font-weight:500;text-align:center;background:var(--card);border:1.5px solid var(--line);border-radius:8px;padding:9px 4px;cursor:pointer;color:var(--muted)}
  .tg.on{background:var(--steel);border-color:var(--steel);color:#fff}
  .radarbox{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:8px 8px 4px;margin-bottom:12px}
  #radar{width:100%;height:auto;display:block}
  .axislabel{font-family:var(--mono);font-size:11px;font-weight:600;fill:var(--ink);cursor:pointer}
  .axislabel.sel{fill:var(--ember)}
  .plegend{display:flex;gap:16px;justify-content:center;padding:6px 0 8px;font-family:var(--mono);font-size:11px;color:var(--muted)}
  .plegend span{display:flex;align-items:center;gap:6px}
  .sw{width:12px;height:12px;border-radius:3px;display:inline-block}
  .readout{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:16px}
  .readout .rl{font-size:18px;font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .verdict{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:#fff;border-radius:5px;padding:3px 8px}
  .v-pro{background:var(--good)} .v-par{background:var(--steel)} .v-con{background:var(--ember)}
  .rstats{display:flex;gap:18px;font-family:var(--mono);font-size:13px;margin-bottom:8px;flex-wrap:wrap}
  .rstats b{font-size:17px;font-weight:700;display:block}
  .rstats .lbl{font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  .rwhy{font-size:13px;color:var(--muted);line-height:1.5}
  .pbar{margin-bottom:13px;cursor:pointer}
  .pbarhd{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--mono);font-size:12.5px;margin-bottom:5px}
  .track{position:relative;height:15px;background:var(--paper);border:1.5px solid var(--line);border-radius:8px;overflow:hidden}
  .fill{position:absolute;left:0;top:0;bottom:0;border-radius:6px 0 0 6px}
  .mark{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);opacity:.55}
  .cols{display:grid;grid-template-columns:1fr;gap:12px;margin-top:14px}
  .col{background:var(--card);border:1.5px solid var(--line);border-radius:12px;overflow:hidden}
  .colhd{padding:11px 15px;font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:#fff}
  .colhd.pro{background:var(--good)} .colhd.con{background:var(--ember)}
  .pitem{padding:11px 15px;border-top:1px solid var(--line)}
  .pitem:first-of-type{border-top:0}
  .pitem .t{font-size:14.5px;font-weight:700;margin-bottom:2px}
  .pitem .d{font-size:12.5px;color:var(--muted);line-height:1.5}
  #toast{position:fixed;left:50%;bottom:140px;transform:translateX(-50%) translateY(20px);opacity:0;transition:.25s;background:var(--ink);color:var(--paper);font-size:13px;font-weight:500;padding:10px 16px;border-radius:8px;z-index:50;pointer-events:none}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="sticky">
  <header>
    <div class="eyebrow">Tracker · Warren · JD Fishponds</div>
    <h1 id="title">Upper</h1>
    <div class="meta" id="subtitle">Auto-progression on · tap a set to log it</div>
  </header>
  <div class="tabs" id="tabs"></div>
</div>
<div class="wrap" id="view"></div>
<div id="rest"><div class="restwrap"><div id="restTime">1:30</div><div class="restlbl">Rest</div><button class="rbtn" onclick="bumpRest(-15)">−15s</button><button class="rbtn" onclick="bumpRest(15)">+15s</button><button class="rbtn" onclick="stopRest()">Done</button></div></div>
<div id="toast"></div>
<script>
const PLAN={
  upper:{label:'Upper',tag:'full upper body',ex:[
    {name:'Back squat (opener)',sets:3,reps:'8',wt:20,unit:'kg',note:'LIGHT — technical only',fixed:true},
    {name:'DB bench press',sets:4,reps:'8–10',min:8,max:10,inc:2,wt:16,unit:'kg ea',note:'More ROM than push day',pri:'Chest'},
    {name:'Lat pulldown / pull-ups',sets:3,reps:'8–10',min:8,max:10,inc:5,wt:26,unit:'kg',note:'Full ROM, dead hang'},
    {name:'DB shoulder press',sets:3,reps:'10–12',min:10,max:12,inc:2,wt:16,unit:'kg ea',note:'Arnold or straight'},
    {name:'Chest-supported row',sets:3,reps:'10–12',min:10,max:12,inc:2.5,wt:16,unit:'kg',note:'Takes lower back out'},
    {name:'EZ curl + skull crusher',sets:4,reps:'12',min:10,max:12,inc:2.5,wt:14.5,unit:'kg',note:'Superset · lead weak arm',pri:'Biceps'},
  ]},
  push:{label:'Push',tag:'chest / shoulders / tris',ex:[
    {name:'Barbell bench press',sets:4,reps:'6–8',min:6,max:8,inc:2.5,wt:22,unit:'kg',note:'Rebuilding — peak ~62kg'},
    {name:'Incline DB press',sets:4,reps:'8–10',min:8,max:10,inc:2,wt:15,unit:'kg ea',note:'Upper chest · extra set',pri:'Chest'},
    {name:'Incline cable fly',sets:3,reps:'12–15',min:12,max:15,inc:5,wt:15,unit:'kg',note:'Chest while fresh · full stretch',pri:'Chest'},
    {name:'Overhead press',sets:3,reps:'8–10',min:8,max:10,inc:2.5,wt:22,unit:'kg',note:'Rebuilding — peak ~40kg'},
    {name:'Cable lateral raise',sets:3,reps:'12–15',min:12,max:15,inc:5,wt:5,unit:'kg/side',note:'Slow eccentric, no swing',repProg:true},
    {name:'Tricep pushdown',sets:3,reps:'12–15',min:12,max:15,inc:5,wt:20,unit:'kg',note:'Rope'},
  ]},
  pull:{label:'Pull',tag:'back / biceps',ex:[
    {name:'Barbell row',sets:4,reps:'6–8',min:6,max:8,inc:2.5,wt:32.5,unit:'kg',note:'Keep it heavy'},
    {name:'Lat pulldown',sets:3,reps:'8–10',min:8,max:10,inc:5,wt:26,unit:'kg',note:'Full ROM, dead hang'},
    {name:'Seated cable row',sets:3,reps:'10–12',min:10,max:12,inc:5,wt:26,unit:'kg',note:'Neutral grip, chest to pad'},
    {name:'Face pull',sets:3,reps:'15–20',min:15,max:20,inc:5,wt:20,unit:'kg',note:'Rear delt + cuff health',repProg:true},
    {name:'DB curl',sets:4,reps:'10–12',min:10,max:12,inc:2,wt:14.5,unit:'kg',note:'Lead weak arm, match reps',pri:'Biceps'},
    {name:'Hammer curl',sets:3,reps:'12',min:10,max:12,inc:2,wt:14.5,unit:'kg',note:'Brachialis + forearm · extra set',pri:'Biceps'},
  ]},
  legs:{label:'Legs',tag:'quads / hams / glutes',ex:[
    {name:'Back squat',sets:4,reps:'6–8',min:6,max:8,inc:2.5,wt:25,unit:'kg',note:'Rebuilding — peak ~90kg'},
    {name:'Romanian deadlift',sets:3,reps:'8–10',min:8,max:10,inc:2.5,wt:42,unit:'kg',note:'Hip hinge — DL peak ~90kg'},
    {name:'Leg press',sets:3,reps:'10–12',min:10,max:12,inc:5,wt:54,unit:'kg',note:'Foot position = emphasis'},
    {name:'Seated leg curl',sets:3,reps:'10–12',min:10,max:12,inc:5,wt:47,unit:'kg',note:'Controlled eccentric'},
    {name:'One-legged / split squat',sets:3,reps:'10 ea',min:8,max:10,inc:2,wt:20,unit:'kg',note:'Loaded now, not bodyweight'},
    {name:'Standing calf raise',sets:4,reps:'15–20',min:15,max:20,inc:5,wt:12.5,unit:'kg',note:'Full stretch, pause at top'},
  ]},
};
const ROTATION=['upper','push','pull','legs'];
const SPRINTS=[
  {name:'Phase 1 — learn the pattern',wk:'Weeks 1–2',rounds:6,work:10,rest:90,spec:'6 rounds · 10s sub-max (80%) · 90s walk',cue:'Deliberately not all-out. Finish with plenty in the tank.'},
  {name:'Phase 2 — build',wk:'Weeks 3–4',rounds:8,work:14,rest:82,spec:'8 rounds · 12–15s near-max (90%) · 75–90s',cue:'Genuinely hard, still clean. Cut a round if form slips.'},
  {name:'Phase 3 — full sprints',wk:'Weeks 5–6+',rounds:9,work:18,rest:75,spec:'8–10 rounds · 15–20s all-out · 60–90s',cue:'Every effort maximal. End the session when speed drops.'},
];
/* profile: map to logged exercise, all-time peak, seed recent, balance ratio vs squat */
const PROFBASE=[
  {key:'Squat',ex:'Back squat',peak:90,seed:28,ratio:1.0},
  {key:'Deadlift',ex:null,peak:90,seed:46,ratio:1.2},
  {key:'Row',ex:'Barbell row',peak:49,seed:40,ratio:0.65},
  {key:'Bench',ex:'Barbell bench press',peak:62,seed:28,ratio:0.75},
  {key:'OHP',ex:'Overhead press',peak:40,seed:25,ratio:0.45},
];

const mem={};
function _lsOK(){try{localStorage.setItem('__t','1');localStorage.removeItem('__t');return true;}catch(e){return false;}}
const HAS_LS=_lsOK();
async function sget(k){
  if(HAS_LS){try{const v=localStorage.getItem(k);return v?JSON.parse(v):null;}catch(e){}}
  try{const r=await window.storage.get(k);return r?JSON.parse(r.value):null;}catch(e){}
  return (k in mem)?mem[k]:null;
}
async function sset(k,v){const s=JSON.stringify(v);
  if(HAS_LS){try{localStorage.setItem(k,s);return;}catch(e){}}
  try{await window.storage.set(k,s);return;}catch(e){}
  mem[k]=v;
}
let HISTORY=[],NEXT='upper',CUR='upper',PHASE=0;
const draftKey=d=>'wvrner:draft:'+d;
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000);}
function vibrate(ms){try{navigator.vibrate&&navigator.vibrate(ms);}catch(e){}}
function fmt(s){const m=Math.floor(s/60),ss=s%60;return m+':'+String(ss).padStart(2,'0');}
function niceDate(ts){return new Date(ts).toLocaleDateString(undefined,{day:'numeric',month:'short'});}
function roundTo(v,step){return Math.round(v/step)*step;}
function lastFor(name){for(const s of HISTORY){const e=s.entries.find(x=>x.name===name);if(e&&e.sets.length)return {sets:e.sets,date:s.date};}return null;}
function e1rm(w,r){w=parseFloat(w);r=parseInt(r)||1;if(!w||isNaN(w))return 0;return w*(1+r/30);}
function recentE1RM(name){for(const s of HISTORY){const e=s.entries.find(x=>x.name===name);if(e){let b=0;e.sets.forEach(st=>b=Math.max(b,e1rm(st.w,st.r)));if(b)return Math.round(b);}}return null;}
function bestE1RM(name){let b=0;HISTORY.forEach(s=>{const e=s.entries.find(x=>x.name===name);if(e)e.sets.forEach(st=>b=Math.max(b,e1rm(st.w,st.r)));});return Math.round(b);}

function recommend(ex){
  if(ex.fixed) return {w:ex.wt,reps:ex.reps,tag:'Hold light',hot:false,why:'Technical opener — keep it light, don\'t chase weight on this one.'};
  const last=lastFor(ex.name);
  if(!last) return {w:ex.wt,reps:ex.reps,tag:'Start',hot:false,why:'Seeded from your logged numbers. Log this once and progression takes over next time.'};
  const ws=last.sets.map(s=>parseFloat(s.w)).filter(n=>!isNaN(n));
  const lastW=ws.length?Math.max(...ws):ex.wt;
  const rs=last.sets.map(s=>parseInt(s.r)).filter(n=>!isNaN(n));
  const days=Math.round((Date.now()-last.date)/86400000);
  if(days>=14){const dl=roundTo(lastW*0.9,ex.inc);return {w:dl,reps:ex.min+'–'+ex.max,tag:'Re-entry',hot:true,why:days+' days off — ease in ~10% down at '+dl+ex.unit+', then it climbs back fast.'};}
  const allTop=rs.length>0&&rs.every(r=>r>=ex.max);
  if(allTop){
    if(ex.repProg) return {w:lastW,reps:ex.max+'+',tag:'Add reps',hot:false,why:'The stack jumps ~'+ex.inc+'kg here — too big. Stay at '+lastW+ex.unit+' and push past '+ex.max+' reps; only add weight when it feels easy.'};
    const nw=lastW+ex.inc;return {w:nw,reps:''+ex.min,tag:'Load up',hot:true,why:'Hit '+ex.max+'+ on every set last time — go to '+nw+ex.unit+' (nearest '+ex.inc+'kg jump) and drop to '+ex.min+' reps.'};
  }
  const low=rs.length?Math.min(...rs):ex.min;
  return {w:lastW,reps:Math.min(ex.max,low+1)+'',tag:'Same weight',hot:false,why:'Hold '+lastW+ex.unit+' and add a rep where you can — get all sets to '+ex.max+', then the weight goes up.'};
}
let draft={};
async function loadDraft(day){const saved=await sget(draftKey(day));draft={};PLAN[day].ex.forEach(ex=>{const rec=recommend(ex);const rows=[];for(let i=0;i<ex.sets;i++){const s=saved&&saved[ex.name]&&saved[ex.name][i];rows.push(s?{w:s.w,r:s.r,done:s.done}:{w:rec.w,r:'',done:false});}draft[ex.name]=rows;});}
let persistT;function persistDraft(){clearTimeout(persistT);persistT=setTimeout(()=>sset(draftKey(CUR),draft),300);}

function renderTabs(){
  const order=[...ROTATION,'sprints','profile','log'];
  const labels={upper:'Upper',push:'Push',pull:'Pull',legs:'Legs',sprints:'Sprints',profile:'Profile',log:'History'};
  document.getElementById('tabs').innerHTML=order.map(d=>`<button class="tab ${d===CUR?'on':''}" onclick="go('${d}')">${labels[d]}${d===NEXT&&d!==CUR?'<span class="dot"></span>':''}</button>`).join('');
}
async function go(day){
  CUR=day;renderTabs();
  const t=document.getElementById('title'),st=document.getElementById('subtitle');
  if(day==='sprints'){t.textContent='Sprints';st.textContent='Once a week · non-lifting day';renderSprints();return;}
  if(day==='profile'){t.textContent='Profile';st.textContent='Pros & cons · live from your logs';renderProfile();return;}
  if(day==='log'){t.textContent='History';st.textContent=HISTORY.length+' saved session'+(HISTORY.length===1?'':'s');renderLog();return;}
  t.textContent=PLAN[day].label;st.textContent=PLAN[day].tag+(day===NEXT?' · up next':'');
  await loadDraft(day);renderDay(day);
}
function renderDay(day){
  const P=PLAN[day];let html='';
  P.ex.forEach((ex,ei)=>{
    const last=lastFor(ex.name);
    const lastTxt=last?`Last: ${last.sets.map(s=>s.r?`${s.r}×${s.w}`:`${s.w}`).join(', ')} · ${niceDate(last.date)}`:`<span class="none">No history yet — first log sets the baseline</span>`;
    const rec=recommend(ex);let rows='';
    for(let i=0;i<ex.sets;i++){const d=draft[ex.name][i];
      rows+=`<div class="setrow ${d.done?'ok':''}" data-ex="${ei}" data-set="${i}"><div class="snum">Set ${i+1}</div><div class="fld"><label>kg</label><input type="number" inputmode="decimal" value="${d.w??''}" data-f="w" placeholder="${rec.w}"></div><div class="fld"><label>reps</label><input type="number" inputmode="numeric" value="${d.r??''}" data-f="r" placeholder="${rec.reps}"></div><button class="done" data-done>${d.done?'✓':'○'}</button></div>`;
    }
    html+=`<div class="card ${ex.pri?'pri':''}"><div class="ehead"><div class="ename">${ex.name}${ex.pri?`<span class="flag">${ex.pri} priority</span>`:''}</div><div class="enote">${ex.note}</div><div class="elast">${lastTxt}</div><div class="rec ${rec.hot?'hot':''}"><div class="recline"><span class="rectag">${rec.tag}</span><span class="recmain">${rec.w}${ex.unit} × ${rec.reps}</span></div><div class="recwhy">${rec.why}</div></div></div>${rows}</div>`;
  });
  html+=`<div class="finishbar"><button class="btn btn-primary" onclick="finish()">Finish &amp; save ${P.label}</button><div class="btn-row"><button class="btn btn-ghost" onclick="resetDay()">Clear day</button><button class="btn btn-ghost" onclick="exportData()">Export data</button></div></div>`+notesHTML();
  const v=document.getElementById('view');v.innerHTML=html;wireDay(v);
}
function wireDay(v){
  v.querySelectorAll('.setrow').forEach(row=>{
    const ei=+row.dataset.ex,si=+row.dataset.set,exName=PLAN[CUR].ex[ei].name;
    row.querySelectorAll('input').forEach(inp=>inp.addEventListener('input',()=>{draft[exName][si][inp.dataset.f]=inp.value;persistDraft();}));
    row.querySelector('[data-done]').addEventListener('click',()=>{const d=draft[exName][si];d.done=!d.done;const wInp=row.querySelector('[data-f="w"]'),rInp=row.querySelector('[data-f="r"]');if(d.done){if(!wInp.value)wInp.value=wInp.placeholder;d.w=wInp.value;d.r=rInp.value;row.classList.add('ok');row.querySelector('[data-done]').textContent='✓';vibrate(30);startRest();}else{row.classList.remove('ok');row.querySelector('[data-done]').textContent='○';}persistDraft();});
  });
}
function notesHTML(){
  const notes=[
    ['Progression','<b>Double progression:</b> add reps each session until every set hits the top of the range, then make the smallest gym jump and drop back down. The app does the maths — just log honestly.'],
    ['Gym jumps','Barbell = 2.5kg (1.25 plates). Dumbbells = 2kg per hand — a big leap, so earn it over sessions. Cables/machines = ~5kg. Light cables (lateral raise, face pull) → add reps, not weight.'],
    ['Profile','The Profile tab is live — finishing a session recalculates your strengths & weaknesses from what you actually lifted.'],
    ['Restart','After 2+ weeks off the app auto-suggests ~10% down as a re-entry. Floor for a session: first exercise, two sets.'],
    ['Weak points','Chest & biceps biased up. On every curl, <b>lead your weaker arm</b> and match that rep count on the strong side.'],
    ['Deadlift','~90kg stall was <b>grip, not strength</b>. Mixed grip, straps or chalk clears it.'],
  ];
  return `<details><summary>How it works + notes</summary>${notes.map(n=>`<div class="note"><div class="k">${n[0]}</div><div>${n[1]}</div></div>`).join('')}</details>`;
}
async function finish(){
  const entries=[];
  PLAN[CUR].ex.forEach(ex=>{const sets=draft[ex.name].filter(s=>s.done||s.w||s.r).map(s=>({w:s.w||recommend(ex).w,r:s.r||''}));if(sets.length)entries.push({name:ex.name,sets});});
  if(!entries.length){toast('Log at least one set first');return;}
  HISTORY.unshift({date:Date.now(),day:CUR,label:PLAN[CUR].label,entries});
  await sset('wvrner:history',HISTORY);
  const idx=ROTATION.indexOf(CUR);NEXT=ROTATION[(idx+1)%ROTATION.length];
  await sset('wvrner:next',NEXT);await sset(draftKey(CUR),null);
  toast(PLAN[CUR].label+' saved · profile updated'); vibrate([40,40,40]); go(NEXT);
}
async function resetDay(){if(!confirm('Clear all logged sets for '+PLAN[CUR].label+' today?'))return;await sset(draftKey(CUR),null);await loadDraft(CUR);renderDay(CUR);toast('Cleared');}
function exportData(){const blob=new Blob([JSON.stringify({history:HISTORY,exported:Date.now()},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='warren-training-history.json';a.click();toast('Data exported');}
function renderLog(){
  const v=document.getElementById('view');
  if(!HISTORY.length){v.innerHTML='<div class="empty">No sessions saved yet.<br>Finish a workout and it\'ll show up here.</div>';return;}
  v.innerHTML=HISTORY.slice(0,40).map(s=>`<div class="hitem"><div class="hhead"><div class="hday">${s.label}</div><div class="hdate">${new Date(s.date).toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'})}</div></div>${s.entries.map(e=>`<div class="hline"><span class="hn">${e.name}</span><span>${e.sets.map(x=>x.r?`${x.r}×${x.w}`:`${x.w}kg`).join(' · ')}</span></div>`).join('')}</div>`).join('')+`<div class="btn-row"><button class="btn btn-ghost" onclick="exportData()">Export data</button></div>`;
}

/* ---------- PROFILE (live) ---------- */
let PROF=[],profMode='peak',profSel=0;
function computeProfile(){
  PROF=PROFBASE.map(b=>{
    const bestLogged=b.ex?bestE1RM(b.ex):0;
    const peak=Math.max(b.peak,bestLogged);
    const rec=(b.ex&&recentE1RM(b.ex))||b.seed;
    return {key:b.key,ex:b.ex,ratio:b.ratio,peak,recent:rec,live:!!(b.ex&&recentE1RM(b.ex))};
  });
  const anchor=PROF.find(x=>x.key==='Squat').peak;
  PROF.forEach(x=>{x.exp=anchor*x.ratio;x.score=Math.round(x.peak/x.exp*100);});
}
function verdictOf(sc){if(sc>=105)return['Strong','v-pro'];if(sc>=97)return['On par','v-par'];if(sc>=90)return['Slightly under','v-con'];return['Under-developed','v-con'];}
const cx=150,cy=155,R=104,MAX=100;
function ang(i){return(-90+i*(360/PROF.length))*Math.PI/180;}
function pt(val,i){const r=Math.min(val,MAX)/MAX*R,a=ang(i);return[cx+r*Math.cos(a),cy+r*Math.sin(a)];}
function polyStr(f){return PROF.map((l,i)=>pt(l[f],i).join(',')).join(' ');}
function renderProfile(){
  computeProfile();
  const anyLive=PROF.some(x=>x.live);
  document.getElementById('view').innerHTML=`
    <div class="ptoggle">
      <div class="tg ${profMode==='peak'?'on':''}" onclick="setProfMode('peak')">Peak</div>
      <div class="tg ${profMode==='recent'?'on':''}" onclick="setProfMode('recent')">Recent</div>
      <div class="tg ${profMode==='both'?'on':''}" onclick="setProfMode('both')">Both</div>
    </div>
    <div class="radarbox"><svg id="radar" viewBox="0 0 300 315"></svg><div class="plegend" id="plegend"></div></div>
    <div class="readout" id="readout"></div>
    <div style="font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--steel);font-weight:700;margin:4px 0 12px">Balance vs your potential</div>
    <div id="pbars"></div>
    <div style="font-family:var(--mono);font-size:10px;color:var(--muted);margin:-4px 0 4px">100% line = a balanced lifter of your strength. Left of it = room to grow.</div>
    <div class="cols">
      <div class="col"><div class="colhd pro">Pros — strengths</div>
        <div class="pitem"><div class="t">Legs are your engine</div><div class="d">Strongest area — leg press ~77kg, leg curl ~67kg. Squat is your best-developed lift and kept climbing when others stalled.</div></div>
        <div class="pitem"><div class="t">High banked ceiling</div><div class="d">True bests (~90kg squat & deadlift, ~62kg bench) sit well above your rebuild — the strength is banked.</div></div>
        <div class="pitem"><div class="t">You always come back</div><div class="d">Every break has been followed by a return to higher numbers. A returner, not a quitter.</div></div>
      </div>
      <div class="col"><div class="colhd con">Cons — where to aim</div>
        <div class="pitem"><div class="t">Deadlift under-developed</div><div class="d">Tied with your squat when it should sit ~20% above. A <b>grip</b> stall, not strength — mixed grip / straps unlocks it.</div></div>
        <div class="pitem"><div class="t">Back / rows lagging</div><div class="d">Biggest gap after deadlift. More pulling is the clearest win.</div></div>
        <div class="pitem"><div class="t">Chest & biceps</div><div class="d">Your felt weak points — now biased first with extra sets. Lead the weak arm on curls to fix the left/right gap.</div></div>
      </div>
    </div>
    <div class="note" style="border:0;padding:14px 0 0;color:var(--muted);font-size:12px;display:block;line-height:1.55">${anyLive?'<b>Live:</b> recent numbers now come from your logged sessions.':'<b>Seeded:</b> recent numbers are estimates until you log sessions — then they go live automatically.'} Balance uses standard ratios (DL ≈1.2× squat, bench ≈0.75×, OHP ≈0.45×, row ≈0.65×) anchored to your squat. Deadlift stays on its peak until conventional pulls are in your rotation.</div>`;
  drawRadar();drawReadout();drawPBars();
}
function drawRadar(){
  const svg=document.getElementById('radar');if(!svg)return;let s='';
  [25,50,75,100].forEach(k=>{s+=`<polygon points="${PROF.map((l,i)=>pt(k,i).join(',')).join(' ')}" fill="none" stroke="#D3D0C5" stroke-width="1"/>`;});
  PROF.forEach((l,i)=>{const e=pt(MAX,i);s+=`<line x1="${cx}" y1="${cy}" x2="${e[0]}" y2="${e[1]}" stroke="#D3D0C5" stroke-width="1"/>`;const a=ang(i),lr=R+20,lx=cx+lr*Math.cos(a),ly=cy+lr*Math.sin(a);const anc=Math.abs(Math.cos(a))<0.3?'middle':(Math.cos(a)>0?'start':'end');s+=`<text class="axislabel ${i===profSel?'sel':''}" x="${lx}" y="${ly+4}" text-anchor="${anc}" onclick="selectProf(${i})">${l.key}</text>`;});
  if(profMode==='peak'||profMode==='both')s+=`<polygon points="${polyStr('peak')}" fill="rgba(44,58,68,.18)" stroke="#2C3A44" stroke-width="2.5" stroke-linejoin="round"/>`;
  if(profMode==='recent'||profMode==='both')s+=`<polygon points="${polyStr('recent')}" fill="rgba(178,61,11,.18)" stroke="#B23D0B" stroke-width="2.5" stroke-linejoin="round"/>`;
  const top=profMode==='recent'?'recent':'peak',col=profMode==='recent'?'#B23D0B':'#2C3A44';
  PROF.forEach((l,i)=>{const p=pt(l[top],i);s+=`<circle cx="${p[0]}" cy="${p[1]}" r="${i===profSel?5:3.2}" fill="${i===profSel?'#B23D0B':col}" stroke="#F4F2EC" stroke-width="1.5" style="cursor:pointer" onclick="selectProf(${i})"/>`;});
  svg.innerHTML=s;
  let lg='';if(profMode==='peak'||profMode==='both')lg+=`<span><span class="sw" style="background:#2C3A44"></span>All-time peak</span>`;if(profMode==='recent'||profMode==='both')lg+=`<span><span class="sw" style="background:#B23D0B"></span>Recent</span>`;document.getElementById('plegend').innerHTML=lg;
}
function drawReadout(){
  const l=PROF[profSel];const[vt,vc]=verdictOf(l.score);const pk=Math.round(l.recent/l.peak*100);
  let why=l.score>=97?`Sits where a balanced lifter of your strength would — no weak link, just rebuilding toward ${l.peak}kg.`:`At ~${l.score}% of what your profile predicts (${Math.round(l.exp)}kg) — one of your clearest places to gain.`;
  if(l.key==='Deadlift')why+=` Your wall was grip, not strength — straps or mixed grip unlocks it.`;
  document.getElementById('readout').innerHTML=`<div class="rl">${l.key} <span class="verdict ${vc}">${vt}</span>${l.live?'':' <span style="font-family:var(--mono);font-size:10px;color:var(--muted)">· est.</span>'}</div><div class="rstats"><div><span class="lbl">Peak</span><b>${l.peak}kg</b></div><div><span class="lbl">Recent</span><b>${l.recent}kg</b></div><div><span class="lbl">Back to</span><b>${pk}%</b></div><div><span class="lbl">vs expected</span><b>${l.score}%</b></div></div><div class="rwhy">${why}</div>`;
}
function drawPBars(){
  const scale=120,markPos=100/scale*100;
  document.getElementById('pbars').innerHTML=PROF.map((l,i)=>{const[vt]=verdictOf(l.score);const w=Math.min(l.score,scale)/scale*100;const col=l.score>=97?'var(--steel)':'var(--ember)';return `<div class="pbar" onclick="selectProf(${i})"><div class="pbarhd"><span>${l.key}</span><span style="color:${col};font-weight:700">${l.score}% <span style="color:var(--muted);font-weight:400">· ${vt}</span></span></div><div class="track"><div class="fill" style="width:${w}%;background:${col}"></div><div class="mark" style="left:${markPos}%"></div></div></div>`;}).join('');
}
function selectProf(i){profSel=i;drawRadar();drawReadout();}
function setProfMode(m){profMode=m;renderProfile();}

let restLeft=0,restInt=null;
function startRest(sec=90){restLeft=sec;showRest();clearInterval(restInt);restInt=setInterval(()=>{restLeft--;showRest();if(restLeft<=0){clearInterval(restInt);vibrate([80,60,80]);setTimeout(stopRest,900);}},1000);}
function showRest(){document.getElementById('restTime').textContent=fmt(Math.max(0,restLeft));document.getElementById('rest').classList.add('up');}
function bumpRest(n){restLeft=Math.max(0,restLeft+n);showRest();}
function stopRest(){clearInterval(restInt);document.getElementById('rest').classList.remove('up');}
let spState='idle',spRound=1,spLeft=0,spInt=null;
function renderSprints(){const p=SPRINTS[PHASE];document.getElementById('view').innerHTML=`<div class="phasepick">${SPRINTS.map((x,i)=>`<div class="ph ${i===PHASE?'on':''}" onclick="setPhase(${i})">P${i+1}<br>${x.wk.replace('Weeks ','wk ')}</div>`).join('')}</div><div class="phasemeta"><b>${p.name}.</b> ${p.spec}. ${p.cue}</div><div class="sprintbox"><div id="sprintState">Ready</div><div id="sprintTime">${p.work}</div><div id="sprintRound">Round 1 / ${p.rounds}</div><div class="sprintbtns"><button class="btn btn-primary" id="spStart" onclick="spToggle()">Start</button><button class="btn btn-ghost" onclick="spReset()">Reset</button></div></div><div class="phasemeta">Warm up 3–5 min easy first, plus gradual run-throughs before max. Assault bike or rower beats the treadmill for your size. Outdoors, grass over tarmac.</div>`;}
function setPhase(i){PHASE=i;spReset();renderSprints();}
function spToggle(){if(spState==='idle'){spBegin('work');document.getElementById('spStart').textContent='Pause';}else if(spInt){clearInterval(spInt);spInt=null;document.getElementById('spStart').textContent='Resume';}else{spTick(true);document.getElementById('spStart').textContent='Pause';}}
function spBegin(phase){const p=SPRINTS[PHASE];spState=phase;spLeft=phase==='work'?p.work:p.rest;spPaint();spTick(true);}
function spTick(start){if(!start)return;clearInterval(spInt);spInt=setInterval(()=>{spLeft--;spPaint();if(spLeft<=0){const p=SPRINTS[PHASE];vibrate([90,50,90]);if(spState==='work'){if(spRound>=p.rounds){spDone();return;}spState='rest';spLeft=p.rest;}else{spRound++;spState='work';spLeft=p.work;}spPaint();}},1000);}
function spPaint(){const p=SPRINTS[PHASE];const st=document.getElementById('sprintState');if(!st)return;st.textContent=spState==='work'?'Sprint':'Recover';st.className=spState;document.getElementById('sprintTime').textContent=Math.max(0,spLeft);document.getElementById('sprintRound').textContent='Round '+spRound+' / '+p.rounds;}
function spDone(){clearInterval(spInt);spInt=null;spState='idle';const st=document.getElementById('sprintState');if(st){st.textContent='Done ✓';st.className='';}const b=document.getElementById('spStart');if(b)b.textContent='Start';spRound=1;vibrate([120,60,120,60,120]);toast('Sprint session complete');}
function spReset(){clearInterval(spInt);spInt=null;spState='idle';spRound=1;spLeft=SPRINTS[PHASE].work;const b=document.getElementById('spStart');if(b)b.textContent='Start';spPaint();const st=document.getElementById('sprintState');if(st){st.textContent='Ready';st.className='';}}
(async function(){HISTORY=(await sget('wvrner:history'))||[];NEXT=(await sget('wvrner:next'))||'upper';CUR=NEXT;go(CUR);})();
</script>
